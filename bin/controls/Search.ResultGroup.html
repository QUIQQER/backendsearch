<section name="{{resultId}}" class="qui-backendsearch-search-resultGroup">
    <header class="qui-backendsearch-search-resultGroup-header">
        {{title}}
    </header>

    <ul>
        {{#entries}}
        <li data-id="{{id}}" data-provider="{{provider}}" title="{{description}}">
            {{#iconUrl}}
            <img class="qui-backendsearch-search-resultGroup-entry-icon"
                 src="{{iconUrl}}"
                 alt="">
            {{/iconUrl}}
            {{^iconUrl}}
            <span class="qui-backendsearch-search-resultGroup-entry-icon {{icon}}" aria-hidden="true"></span>
            {{/iconUrl}}
            <span class="qui-backendsearch-search-resultGroup-entry-text">{{title}}</span>
        </li>
        {{/entries}}
    </ul>

    {{#hasMore}}
    <div class="qui-backendsearch-search-resultGroup-more">
        <button type="button"
                class="qui-button"
                data-name="show-more"
                data-group="{{group}}">{{showMoreText}}</button>
    </div>
    {{/hasMore}}
</section>
