<section id="{{resultId}}"
         class="qui-backendsearch-search-resultGroup"
         aria-labelledby="{{resultId}}-title">
    <h3 id="{{resultId}}-title" class="qui-backendsearch-search-resultGroup-header">
        {{title}}
    </h3>

    <ul>
        {{#entries}}
        <li>
            <button type="button"
                    class="qui-backendsearch-search-resultGroup-entry"
                    data-name="result-entry"
                    data-id="{{id}}"
                    data-provider="{{provider}}"
                    title="{{description}}">
                {{#iconUrl}}
                <img class="qui-backendsearch-search-resultGroup-entry-icon"
                     src="{{iconUrl}}"
                     alt="">
                {{/iconUrl}}
                {{^iconUrl}}
                <span class="qui-backendsearch-search-resultGroup-entry-icon {{icon}}" aria-hidden="true"></span>
                {{/iconUrl}}
                <span class="qui-backendsearch-search-resultGroup-entry-text">{{title}}</span>
            </button>
        </li>
        {{/entries}}
    </ul>

    {{#hasMore}}
    <div class="qui-backendsearch-search-resultGroup-more">
        <button type="button"
                class="qui-button"
                data-name="show-more"
                data-group="{{group}}">{{showMoreText}}</button>
    </div>
    {{/hasMore}}
</section>
